name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: satal
          POSTGRES_USER: satal
          POSTGRES_PASSWORD: satal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satal -d satal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://satal:satal@localhost:5432/satal
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
